<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HireLane – Job Portal</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">HireLane</div>
    <nav id="nav">
      <button data-view="jobs" class="active">Find jobs</button>
      <button data-view="saved">Saved <span id="savedCount" class="badge">0</span></button>
      <button data-view="applications">Applications <span id="appCount" class="badge">0</span></button>
      <button data-view="post">Post a job</button>
    </nav>
  </header>

  <main>
    <!-- FIND JOBS -->
    <section id="view-jobs" class="view active">
      <div class="intro">
        <h1>Find work that fits your skills</h1>
        <p id="resultCount" class="muted"></p>
      </div>
      <div class="filters">
        <input id="q" type="search" placeholder="Job title, company or skill">
        <input id="loc" type="search" placeholder="Location">
        <select id="type">
          <option value="">All job types</option>
          <option>Full-time</option><option>Part-time</option>
          <option>Internship</option><option>Contract</option><option>Remote</option>
        </select>
        <select id="level">
          <option value="">All levels</option>
          <option>Fresher</option><option>1-3 yrs</option><option>3+ yrs</option>
        </select>
        <button id="clear" class="btn ghost">Clear</button>
      </div>
      <div id="jobList" class="list"></div>
    </section>

    <!-- SAVED -->
    <section id="view-saved" class="view">
      <div class="intro"><h1>Saved jobs</h1></div>
      <div id="savedList" class="list"></div>
    </section>

    <!-- APPLICATIONS -->
    <section id="view-applications" class="view">
      <div class="intro"><h1>Your applications</h1></div>
      <div id="appList" class="list"></div>
    </section>

    <!-- POST JOB -->
    <section id="view-post" class="view">
      <div class="intro"><h1>Post a job</h1><p class="muted">Your listing appears on Find jobs right away.</p></div>
      <form id="postForm" class="card form">
        <label>Job title<input name="title" required></label>
        <label>Company<input name="company" required></label>
        <label>Location<input name="location" required></label>
        <label>Job type
          <select name="type"><option>Full-time</option><option>Part-time</option><option>Internship</option><option>Contract</option><option>Remote</option></select>
        </label>
        <label>Experience level
          <select name="level"><option>Fresher</option><option>1-3 yrs</option><option>3+ yrs</option></select>
        </label>
        <label>Salary (optional)<input name="salary" placeholder="e.g. ₹6–9 LPA"></label>
        <label class="full">Skills (comma separated)<input name="skills" placeholder="HTML, CSS, JavaScript"></label>
        <label class="full">Description<textarea name="desc" rows="5" required></textarea></label>
        <button class="btn" type="submit">Publish job</button>
      </form>
    </section>
  </main>

  <!-- JOB DETAIL + APPLY -->
  <dialog id="modal">
    <div id="modalBody"></div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
